# .github/workflows/contract.yml
name: contract

on:
  pull_request:
    paths:
      - "services/api/**"
      - "docs/fixtures/rest/**"
      - ".github/workflows/contract.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "docs/fixtures/rest/**"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e ".[dev]"

      # Contract + schema tests run against an in-process app via testcontainers
      # Postgres + ASGI transport. This avoids the auth-vs-OpenAPI mismatch that
      # would occur if `schemathesis run --checks all` hit a live server gated
      # by X-Device-Key. The embedded test allowlists checks that conflict with
      # the auth-first middleware.
      - run: uv run pytest tests/integration -v -m "contract or schema"
